plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Better Combat is a dev-time dependency only (license: All Rights Reserved): never include/embed it, never copy its jar or assets.
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"reiatsu_test" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Dev-only: dedicated server smoke test (tools/server_smoke.py). Own run dir, so it never touches the client run/ dir.
		server {
			runDir "run-server"
			vmArg "-Xmx1536M"
		}
		// Dev-only: open the game window on the monitor containing this point (gradle.properties dev_monitor).
		client {
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
		}
		// Dev-only visual verification harness (spike 2b). Not active in normal runs.
		spike {
			client()
			name = "Spike Harness"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.spike=true"
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--width", "1280", "--height", "720"
			if (project.hasProperty("glow")) {
				vmArg "-Dreiatsu.glowNormal=${project.property('glow')}"
			}
			if (project.hasProperty("item")) {
				vmArg "-Dreiatsu.spike.item=${project.property('item')}"
			}
			if (project.hasProperty("tune")) {
				vmArg "-Dreiatsu.spike.tune=${project.property('tune')}"
			}
		}
		// Dev-only: second game client for PvP / parry tests (gradlew runClient2). Own game dir run2 (own saves, logs, lock files),
		// username TestB. Start runServer first, then runClient and runClient2, both join localhost:25565 (see README).
		client2 {
			client()
			name = "Client 2 (TestB)"
			runDir "run2"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--username", "TestB"
		}
		// Dev-only automated verification of phase 4 (state machine, server abilities, HUD, sync): gradlew runPhase4
		phase4 {
			client()
			name = "Phase 4 Harness"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.phase4=true"
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--width", "1280", "--height", "720"
		}
		// Dev-only automated verification of phase 5 (voice bridge, matcher in game, latency): gradlew runPhase5
		phase5 {
			client()
			name = "Phase 5 Harness"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.phase5=true"
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--width", "1280", "--height", "720"
		}
		// Dev-only automated visual verification of phase 6 (FX, HUD): gradlew runPhase6 [-Phold=<scenario>] [-PfreezeAt=<ms>]
		// [-Pfx=key=value,key=value] (any FxConfig key, e.g. -Pfx=fxTier=LOW,reduceMotion=true)
		phase6 {
			client()
			name = "Phase 6 Harness"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.phase6=true"
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--width", "1280", "--height", "720"
			if (project.hasProperty("hold")) {
				vmArg "-Dreiatsu.fx.hold=${project.property('hold')}"
			}
			if (project.hasProperty("freezeAt")) {
				vmArg "-Dreiatsu.fx.freezeAt=${project.property('freezeAt')}"
			}
			if (project.hasProperty("fx")) {
				project.property("fx").toString().split(",").each { kv ->
					def parts = kv.split("=", 2)
					if (parts.length == 2) {
						vmArg "-Dreiatsu.fx.${parts[0]}=${parts[1]}"
					}
				}
			}
			if (project.hasProperty("remote")) {
				vmArg "-Dreiatsu.fx.remote=${project.property('remote')}"
			}
		}
		// Dev-only automated visual verification of the Uryu effects (URYU_VFX_STORYBOARD 6): gradlew runPhase7 [-Phold=<scenario>] [-PfreezeAt=<ms>]
		// [-Pfx=key=value,...]. The phase 6 engine with the Uryu scenarios added (screenshots p7_*.png); the default scenario is uryu_atlas
		phase7 {
			client()
			name = "Phase 7 Harness (Uryu)"
			ideConfigGenerated(false)
			vmArg "-Dreiatsu.phase6=true"
			vmArg "-Dreiatsu.phase7=true"
			vmArg "-Dreiatsu.devMonitor=${project.findProperty('dev_monitor') ?: ''}"
			programArgs "--width", "1280", "--height", "720", "--username", "ProbeP7" // R15: a fixed name, so the default skin (arm width and colour) is the same in every run
			vmArg "-Dreiatsu.fx.hold=${project.findProperty('hold') ?: 'uryu_atlas'}"
			if (project.hasProperty("freezeAt")) {
				vmArg "-Dreiatsu.fx.freezeAt=${project.property('freezeAt')}"
			}
			if (project.hasProperty("fx")) {
				project.property("fx").toString().split(",").each { kv ->
					def parts = kv.split("=", 2)
					if (parts.length == 2) {
						vmArg "-Dreiatsu.fx.${parts[0]}=${parts[1]}"
					}
				}
			}
			if (project.hasProperty("remote")) {
				vmArg "-Dreiatsu.fx.remote=${project.property('remote')}"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Better Combat (All Rights Reserved): runtime only for dev runs, no include(), no jar in the repo. Transitive deps are not
	// resolved via the Modrinth maven (empty pom), so playerAnimator and Cloth Config are listed by hand.
	modLocalRuntime "maven.modrinth:better-combat:2.4.0+1.21.1-fabric"
	modLocalRuntime "maven.modrinth:playeranimator:2.0.4+1.21.1-fabric"
	modLocalRuntime "maven.modrinth:cloth-config:15.0.140+fabric"
	// tiny-config is jar-in-jar inside Better Combat; Loom does not load nested jars in dev, so add it explicitly (same version as nested).
	modLocalRuntime "maven.modrinth:tiny-config:3.1.0-fabric"
	// Compile only (BC5): public APIs we call or hook (BC CombatFlags, playerAnimator stack/FirstPersonMode). Not embedded, not in the jar.
	modCompileOnly "maven.modrinth:better-combat:2.4.0+1.21.1-fabric"
	modCompileOnly "maven.modrinth:playeranimator:2.0.4+1.21.1-fabric"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	// the voice bridge page is served by the mod itself (GET /), single source of truth is voice-bridge/index.html
	from("../voice-bridge") {
		include "index.html"
		into "assets/reiatsu_test/voice"
	}

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Development lab for the voice bridge page: the real HTTP bridge and matcher without a game (see docs/VOICE_QA.md)
tasks.register("voiceLab", JavaExec) {
	group = "verification"
	description = "Serves voice-bridge/index.html with the real matcher in ungated mode on 127.0.0.1:47831 (no game)"
	dependsOn "testClasses"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.minebleach.reiatsutest.voice.VoiceLabServer"
	args = [project.findProperty("labPort") ?: "47831"]
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// runClient2: seed run2/ from run/ on the first start (config + options.txt only, never saves), so both clients look the same.
afterEvaluate {
	tasks.named("runClient2") {
		doFirst {
			def src = file("run")
			def dst = file("run2")
			dst.mkdirs()
			def opts = new File(dst, "options.txt")
			if (!opts.exists() && new File(src, "options.txt").exists()) {
				opts.text = new File(src, "options.txt").text
			}
			def cfg = new File(dst, "config")
			if (!cfg.exists() && new File(src, "config").exists()) {
				copy { from new File(src, "config"); into cfg }
			}
		}
	}
}

// Dev harnesses: make sure the first run does not stop at the accessibility onboarding screen and is silent.
afterEvaluate {
	["runSpike", "runPhase4", "runPhase5", "runPhase6", "runPhase7"].each { taskName ->
		tasks.named(taskName) {
			doFirst {
				def opts = file("run/options.txt")
				if (!opts.exists()) {
					opts.parentFile.mkdirs()
					opts.text = ["onboardAccessibility:false", "skipMultiplayerWarning:true", "skipRealms32bitWarning:true",
						"tutorialStep:none", "joinedFirstServer:true", "soundCategory_master:0.0", "lang:en_us",
						"pauseOnLostFocus:false", "enableVsync:false", "maxFps:260", "renderDistance:6"].join(System.lineSeparator()) + System.lineSeparator()
				}
			}
		}
	}
}
